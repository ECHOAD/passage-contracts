[package]
name = "streaming-billing"
version = "0.1.0"
authors = ["Passage Protocol"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-std = { version = "2.1.3", features = ["staking", "stargate", "cosmwasm_1_2"] }
cosmwasm-schema = "2.1.3"
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
thiserror = "1.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }

[dev-dependencies]
cw-multi-test = "2.1.1"
